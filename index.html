<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Nhân Viên</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5; 
            --secondary: #0ea5e9; 
            --success: #10b981; 
            --danger: #ef4444; 
            --dark: #1e293b; 
            --text-main: #334155; 
            --text-muted: #64748b; 
            --border: #cbd5e1; 
            --bg-body: #f1f5f9; 
            --bg-input: #f8fafc;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Poppins', sans-serif; 
        }

        body {
            background-color: var(--bg-body);
            background-image: radial-gradient(circle at top right, #e0e7ff, transparent 40%), radial-gradient(circle at bottom left, #dbeafe, transparent 40%);
            min-height: 100vh; 
            padding: 40px 20px; 
            color: var(--text-main); 
            font-size: 14px;
        }

        .container {
            max-width: 1100px; 
            margin: 0 auto; 
            background: #ffffff; 
            padding: 40px;
            border-radius: 16px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); 
            border: 1px solid #e2e8f0;
        }

        .header-title { 
            text-align: center; 
            margin-bottom: 35px; 
        }

        .header-title h2 { 
            color: var(--dark); 
            font-size: 28px; 
            font-weight: 700; 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        form { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px 30px; 
        }

        .form-group { 
            display: flex; 
            flex-direction: column; 
        }

        label { 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: var(--dark); 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        label i { 
            color: var(--primary); 
            font-size: 14px; 
            width: 16px; 
            text-align: center; 
        }

        input, select, textarea { 
            padding: 12px 16px; 
            border: 1.5px solid var(--border); 
            border-radius: 8px; 
            outline: none; 
            background-color: var(--bg-input); 
            transition: all 0.3s; 
        }

        input:focus, select:focus, textarea:focus { 
            border-color: var(--primary); 
            background-color: #fff; 
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); 
        }

        .is-invalid { 
            border-color: var(--danger) !important; 
            background-color: #fef2f2 !important; 
        }

        .error-msg { 
            color: var(--danger); 
            font-size: 12px; 
            margin-top: 6px; 
            height: 18px; 
            font-weight: 500; 
            display: flex; 
            align-items: center; 
        }

        .btn-group { 
            grid-column: span 2; 
            display: flex; 
            gap: 15px; 
            justify-content: flex-end; 
            margin-top: 15px; 
            padding-top: 20px; 
            border-top: 1px dashed var(--border); 
        }

        button { 
            padding: 12px 28px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 14px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            transition: all 0.3s ease; 
        }
        
        #btnSubmit { 
            background: linear-gradient(135deg, var(--success), #047857); 
            color: white; 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); 
        }

        #btnReset { 
            background: #f1f5f9; 
            color: var(--text-main); 
            border: 1px solid var(--border); 
        }

        .filter-section { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin: 40px 0 20px; 
            background: var(--bg-input); 
            padding: 15px 20px; 
            border-radius: 10px; 
            border: 1px solid var(--border); 
        }

        .search-wrapper { 
            position: relative; 
            width: 350px; 
        }

        .search-wrapper i { 
            position: absolute; 
            left: 14px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: var(--text-muted); 
        }

        #txtSearch { 
            width: 100%; 
            padding-left: 40px; 
            background: #fff; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
        }

        .counter { 
            font-weight: 500; 
            font-size: 15px; 
            background: #fff; 
            padding: 8px 16px; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
        }

        .counter span { 
            color: var(--primary); 
            font-size: 18px; 
            font-weight: 700; 
            margin-left: 6px; 
        }

        .table-wrapper { 
            border-radius: 10px; 
            border: 1px solid var(--border); 
            overflow: hidden; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); 
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            background: #fff; 
        }

        th, td { 
            padding: 16px; 
            text-align: left; 
            border-bottom: 1px solid var(--border); 
        }

        th { 
            background-color: var(--dark); 
            color: #f8fafc; 
            font-weight: 500; 
            text-transform: uppercase; 
            font-size: 13px; 
        }

        tr:hover td { 
            background-color: var(--bg-input); 
        }

        td { 
            color: var(--text-main); 
            vertical-align: middle; 
        }

        .badge { 
            padding: 4px 10px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 600; 
            background: #e0e7ff; 
            color: var(--primary); 
        }

        .action-buttons { 
            display: flex; 
            gap: 8px; 
        }

        .action-buttons button { 
            padding: 6px 12px; 
            font-size: 12px; 
            border-radius: 6px; 
        }

        .btn-edit { 
            background-color: #eff6ff; 
            color: var(--secondary); 
            border: 1px solid #bfdbfe; 
        }

        .btn-delete { 
            background-color: #fef2f2; 
            color: var(--danger); 
            border: 1px solid #fecaca; 
        }
        
        #emptyMessage { 
            text-align: center; 
            padding: 40px; 
            color: #94a3b8; 
            font-size: 16px; 
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-title">
            <h2><i class="fa-solid fa-users-gear"></i> QUẢN LÝ NHÂN VIÊN </h2>
        </div>
        
        <form id="employeeForm">
            <input type="hidden" id="editIndex" value="-1">

            <div class="form-group">
                <label><i class="fa-solid fa-id-badge"></i> Mã nhân viên</label>
                <input type="text" id="txtMa" placeholder="VD: NV001">
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Họ và tên</label>
                <input type="text" id="txtTen" placeholder="Nhập đầy đủ họ tên">
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-envelope"></i> Địa chỉ Email</label>
                <input type="text" id="txtEmail" placeholder="example@domain.com">
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-phone"></i> Số điện thoại</label>
                <input type="text" id="txtSdt" placeholder="Nhập 10 chữ số">
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-briefcase"></i> Chức vụ</label>
                <select id="txtChucVu">
                    <option value="">-- Chọn chức vụ --</option>
                    <option value="Giám đốc">Giám đốc (Director/CEO)</option>
                    <option value="Phó Giám đốc">Phó Giám đốc</option>
                    <option value="Trưởng phòng">Trưởng phòng</option>
                    <option value="Phó phòng">Phó phòng</option>
                    <option value="Trưởng nhóm">Trưởng nhóm (Team Leader)</option>
                    <option value="Chuyên viên">Chuyên viên</option>
                    <option value="Nhân viên">Nhân viên</option>
                    <option value="Kế toán">Kế toán</option>
                    <option value="Nhân sự">Hành chính - Nhân sự</option>
                    <option value="IT">IT - Kỹ thuật</option>
                    <option value="Thực tập sinh">Thực tập sinh (Intern)</option>
                </select>
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-money-bill-wave"></i> Mức Lương</label>
                <input type="number" id="txtLuong" placeholder="Lớn hơn 3.000.000">
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-calendar-days"></i> Ngày vào làm</label>
                <input type="date" id="txtNgay">
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-comment-dots"></i> Ghi chú</label>
                <textarea id="txtGhiChu" rows="1" placeholder="Nhập ghi chú bổ sung..."></textarea>
            </div>

            <div class="btn-group">
                <button type="button" id="btnReset"><i class="fa-solid fa-rotate-right"></i> Làm mới</button>
                <button type="submit" id="btnSubmit"><i class="fa-solid fa-floppy-disk"></i> Lưu nhân viên</button>
            </div>
        </form>

        <div class="filter-section">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="txtSearch" placeholder="Tìm kiếm nhân viên theo tên...">
            </div>
            <div class="counter">
                <i class="fa-solid fa-users"></i> Tổng nhân sự: <span id="totalEmp">0</span>
            </div>
        </div>

        <div class="table-wrapper">
            <div id="emptyMessage">
                <i class="fa-solid fa-folder-open fa-2x" style="margin-bottom:10px;"></i><br>Chưa có dữ liệu nhân viên
            </div>
            
            <table id="empTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Mã NV</th>
                        <th>Họ tên</th>
                        <th>Liên hệ</th>
                        <th>Chức vụ</th>
                        <th>Lương</th>
                        <th>Ngày vào</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let employees = [];

        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("employeeForm");
            const txtSearch = document.getElementById("txtSearch");

            function validateField(inputEl, condition, errorMsg) {
                const errorSpan = inputEl.nextElementSibling;
                if (condition) {
                    inputEl.classList.add("is-invalid");
                    if (errorSpan) {
                        errorSpan.innerHTML = `<i class="fa-solid fa-circle-exclamation" style="margin-right:4px;"></i> ${errorMsg}`;
                    }
                    return false;
                } else {
                    inputEl.classList.remove("is-invalid");
                    if (errorSpan) {
                        errorSpan.innerHTML = "";
                    }
                    return true;
                }
            }

            function checkMa() { 
                const val = $("#txtMa").val().trim();
                return validateField(document.getElementById("txtMa"), val === "" || val.length < 4, "Tối thiểu 4 ký tự"); 
            }

            function checkTen() { 
                const val = $("#txtTen").val().trim();
                return validateField(document.getElementById("txtTen"), val === "" || val.length < 5, "Tối thiểu 5 ký tự"); 
            }

            function checkEmail() { 
                const val = $("#txtEmail").val().trim();
                const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return validateField(document.getElementById("txtEmail"), !regex.test(val), "Email không hợp lệ"); 
            }

            function checkSdt() { 
                const val = $("#txtSdt").val().trim();
                const regex = /^[0-9]{10}$/;
                return validateField(document.getElementById("txtSdt"), !regex.test(val), "Cần đúng 10 số"); 
            }

            function checkChucVu() { 
                const val = $("#txtChucVu").val();
                return validateField(document.getElementById("txtChucVu"), val === "", "Vui lòng chọn"); 
            }

            function checkLuong() { 
                const val = Number($("#txtLuong").val());
                return validateField(document.getElementById("txtLuong"), val <= 3000000, "Phải > 3.000.000"); 
            }

            function checkNgay() { 
                const val = $("#txtNgay").val();
                return validateField(document.getElementById("txtNgay"), val === "", "Không để trống"); 
            }

            document.getElementById("txtMa").addEventListener("input", checkMa);
            document.getElementById("txtTen").addEventListener("input", checkTen);
            document.getElementById("txtEmail").addEventListener("input", checkEmail);
            document.getElementById("txtSdt").addEventListener("input", checkSdt);
            document.getElementById("txtChucVu").addEventListener("change", checkChucVu);
            document.getElementById("txtLuong").addEventListener("input", checkLuong);
            document.getElementById("txtNgay").addEventListener("change", checkNgay);

            function renderTable(filterData = null) {
                const dataToRender = filterData || employees;
                const tbody = $("#employeeTableBody");
                
                tbody.empty(); 

                if (dataToRender.length === 0) {
                    $("#emptyMessage").show();
                    $("#empTable").hide();
                } else {
                    $("#emptyMessage").hide();
                    $("#empTable").show();

                    dataToRender.forEach((emp) => {
                        const trStr = `
                            <tr>
                                <td><strong>${emp.ma}</strong></td>
                                <td>
                                    <div><strong>${emp.ten}</strong></div>
                                    <div style="font-size: 12px; color: #64748b;">${emp.ghichu}</div>
                                </td>
                                <td>
                                    <div><i class="fa-solid fa-envelope"></i> ${emp.email}</div>
                                    <div><i class="fa-solid fa-phone"></i> ${emp.sdt}</div>
                                </td>
                                <td><span class="badge">${emp.chucvu}</span></td>
                                <td><strong style="color: #059669">${Number(emp.luong).toLocaleString()} ₫</strong></td>
                                <td>${emp.ngay}</td>
                                <td>
                                    <div class="action-buttons">
                                        <button class="btn-edit" data-id="${emp.id}"><i class="fa-solid fa-pen"></i></button>
                                        <button class="btn-delete" data-id="${emp.id}"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </td>
                            </tr>
                        `;
                        
                        const $tr = $(trStr);
                        $tr.hide();
                        tbody.append($tr); 
                        $tr.fadeIn(300); 
                    });
                }

                document.querySelector("#totalEmp").innerHTML = employees.length; 
            }

            renderTable();

            form.addEventListener("submit", function (e) { 
                e.preventDefault();

                const isMaValid = checkMa();
                const isTenValid = checkTen();
                const isEmailValid = checkEmail();
                const isSdtValid = checkSdt();
                const isChucVuValid = checkChucVu();
                const isLuongValid = checkLuong();
                const isNgayValid = checkNgay();

                if (isMaValid && isTenValid && isEmailValid && isSdtValid && isChucVuValid && isLuongValid && isNgayValid) {
                    
                    const empData = {
                        id: Date.now().toString(), 
                        ma: $("#txtMa").val().trim(),
                        ten: $("#txtTen").val().trim(),
                        email: $("#txtEmail").val().trim(),
                        sdt: $("#txtSdt").val().trim(),
                        chucvu: $("#txtChucVu").val(),
                        luong: $("#txtLuong").val(),
                        ngay: $("#txtNgay").val(),
                        ghichu: $("#txtGhiChu").val().trim()
                    };

                    const editIndex = $("#editIndex").val();

                    if (editIndex === "-1") {
                        if (employees.some(emp => emp.ma.toLowerCase() === empData.ma.toLowerCase())) {
                            validateField(document.getElementById("txtMa"), true, "Mã đã tồn tại");
                            return;
                        }
                        employees.push(empData);
                    } else {
                        const idx = employees.findIndex(e => e.id === editIndex);
                        if (idx !== -1) {
                            if (employees.some((emp, i) => i !== idx && emp.ma.toLowerCase() === empData.ma.toLowerCase())) {
                                validateField(document.getElementById("txtMa"), true, "Mã đã tồn tại");
                                return;
                            }
                            employees[idx] = { ...employees[idx], ...empData, id: editIndex };
                        }
                    }

                    renderTable();
                    resetForm();
                }
            });

            function resetForm() {
                form.reset();
                $("#editIndex").val("-1");
                $("#btnSubmit").html('<i class="fa-solid fa-floppy-disk"></i> Lưu nhân viên').css("background", "linear-gradient(135deg, var(--success), #047857)"); 
                $("#txtMa").prop("disabled", false); 
                $("input, select, textarea").removeClass("is-invalid");
                $(".error-msg").html("");
            }

            $("#btnReset").click(function() { 
                resetForm();
            });

            $("#employeeTableBody").on("click", ".btn-edit", function () {
                const emp = employees.find(e => e.id === $(this).attr("data-id"));
                if (emp) {
                    $("#txtMa").val(emp.ma).prop("disabled", true);
                    $("#txtTen").val(emp.ten);
                    $("#txtEmail").val(emp.email);
                    $("#txtSdt").val(emp.sdt);
                    $("#txtChucVu").val(emp.chucvu);
                    $("#txtLuong").val(emp.luong);
                    $("#txtNgay").val(emp.ngay);
                    $("#txtGhiChu").val(emp.ghichu);
                    
                    $("#editIndex").val(emp.id);
                    $("#btnSubmit").html('<i class="fa-solid fa-pen-to-square"></i> Cập nhật').css("background", "linear-gradient(135deg, var(--primary), var(--secondary))");
                    $("input, select, textarea").removeClass("is-invalid");
                    $(".error-msg").html("");
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            $("#employeeTableBody").on("click", ".btn-delete", function () {
                const id = $(this).attr("data-id");
                if (confirm("Chắc chắn xóa?")) {
                    $(this).closest("tr").fadeOut(300, function() {
                        employees = employees.filter(e => e.id !== id);
                        renderTable();
                        if ($("#editIndex").val() === id) {
                            resetForm();
                        }
                    });
                }
            });

            txtSearch.addEventListener("input", function () {
                const keyword = this.value.toLowerCase().trim();
                renderTable(employees.filter(emp => emp.ten.toLowerCase().includes(keyword)));
            });
        });
    </script>
</body>
</html>
